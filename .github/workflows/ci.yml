name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # file locking, git and paths differ; both are supported
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no floating major tags)
        with:
          enable-cache: true
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: constraints.txt matches uv.lock (the install scripts pin from it)
        if: runner.os == 'Linux'
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-dev -o constraints.txt
          git diff --exit-code constraints.txt
      - run: uv sync --locked
      - run: uv run pytest -q  # offline: no API keys, no model downloads
