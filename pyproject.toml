[project]
name = "hotel"
version = "0.2.0"
description = "Personal information harness: append-only Reg, living Lobby document, annotation-gated retrieval."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "textual>=0.80",
    "mcp>=1.20",
    "openai>=3.35.1",
    "exa-py>=2.26.0",
    "parallel-web>=1.3.5",
    "inceptionai>=0.2.0",
    "groq>=1.7.0",
    "fastembed>=0.7",
    "pypdf>=5",
    "numpy>=2",
]

[project.scripts]
hotel = "hotel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
