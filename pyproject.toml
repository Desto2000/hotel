[project]
name = "hotel"
version = "0.1.0"
description = "Personal information harness: append-only Reg, living Lobby document, annotation-gated retrieval."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "textual>=0.80",
]

[project.scripts]
hotel = "hotel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
